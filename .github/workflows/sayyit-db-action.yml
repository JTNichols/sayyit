# Must disable Azure Key Vault network restrictions for this workflow, then re-enable.
name: Build and deploy Sayyit.Db (DACPAC) to Azure SQL

on:
  push:
    branches: [ 'env/dev', 'main' ]
    paths:
      - 'Sayyit.Db/**'
      - '.github/workflows/sayyit-db-action.yml'
  pull_request:
    branches: [ 'env/dev', 'main' ]
    types: [ closed ]
    paths:
      - 'Sayyit.Db/**'
      - '.github/workflows/sayyit-db-action.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  WORKING_DIRECTORY: Sayyit.Db/Sayyit.Db.sqlproj
  CONFIGURATION: Release
  DACPAC_NAME: sayyit-db.dacpac
  RESOURCE_GROUP: sayyitadmin_rg1
  # choose server/db by branch name (main -> prod, otherwise dev)
  AZURE_SQL_SERVER_FQDN: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'sayyit-prod-sqlserver.database.windows.net' || 'sayyit-dev-sqlserver.database.windows.net' }}
  AZURE_SQL_DB: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'sayyit-prod-db' || 'sayyit-dev-db' }}

jobs:
  build:
    name: Build DACPAC
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Sayyit.Db (.sqlproj) and locate DACPAC
        shell: pwsh
        run: |
          $project = '${{ env.WORKING_DIRECTORY }}'
          Write-Host "Building project with MSBuild: $project"

          msbuild $project /t:Build /p:Configuration='${{ env.CONFIGURATION }}' /p:VisualStudioVersion=17.0

          if ($LASTEXITCODE -ne 0) {
            throw "msbuild failed with exit code $LASTEXITCODE"
          }

          # Find generated .dacpac
          $dacpac = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*.dacpac' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $dacpac) {
            throw "Could not find a generated .dacpac in the repository workspace after build."
          }

          Write-Host "Found DACPAC: $($dacpac.FullName)"

          $dest = Join-Path $env:RUNNER_TEMP '${{ env.DACPAC_NAME }}'
          Copy-Item -Path $dacpac.FullName -Destination $dest -Force
          Write-Host "Copied DACPAC to: $dest"

      - name: Upload DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayyit-db-dacpac
          path: ${{ runner.temp }}/${{ env.DACPAC_NAME }}
          if-no-files-found: error

  deploy:
    name: Deploy DACPAC to Azure SQL
    needs: build
    runs-on: windows-latest
    # deploy only on push or merged PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
      - name: Download DACPAC artifact
        uses: actions/download-artifact@v4
        with:
          name: sayyit-db-dacpac
          path: ${{ runner.temp }}/site

      - name: Verify downloaded DACPAC
        shell: pwsh
        run: |
          $dacpac = Join-Path $env:RUNNER_TEMP "site/${{ env.DACPAC_NAME }}"
          if (-not (Test-Path $dacpac)) {
            throw "Downloaded DACPAC does not exist: $dacpac"
          }
          Write-Host "Using DACPAC: $dacpac"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 988f19e5-f513-485b-8cab-247ba99e2f67

      - name: Temporarily allow SQL access from GitHub runner
        shell: pwsh
        run: |
          $serverFqdn = '${{ env.AZURE_SQL_SERVER_FQDN }}'
          $serverName = $serverFqdn.Split('.')[0]
          $resourceGroup = '${{ env.RESOURCE_GROUP }}'

          $originalPublicNetworkAccess = (az sql server show --name $serverName --resource-group $resourceGroup --query publicNetworkAccess -o tsv).Trim()
          if (-not $originalPublicNetworkAccess) {
            throw "Could not read current SQL publicNetworkAccess for $serverName"
          }

          "SQL_SERVER_NAME=$serverName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQL_PUBLIC_NETWORK_ACCESS_ORIGINAL=$originalPublicNetworkAccess" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($originalPublicNetworkAccess -ne 'Enabled') {
            az sql server update --name $serverName --resource-group $resourceGroup --set publicNetworkAccess=Enabled
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to enable public network access on SQL server $serverName"
            }
          }

          $runnerIp = (Invoke-RestMethod -Uri 'https://api.ipify.org').ToString().Trim()
          if (-not $runnerIp) {
            throw "Could not determine GitHub runner public IP"
          }

          $ruleName = "gha-${{ github.run_id }}-${{ github.run_attempt }}"
          az sql server firewall-rule create --resource-group $resourceGroup --server $serverName --name $ruleName --start-ip-address $runnerIp --end-ip-address $runnerIp
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create SQL firewall rule $ruleName for IP $runnerIp"
          }

          "SQL_FIREWALL_RULE_NAME=$ruleName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Added temporary SQL firewall rule $ruleName for runner IP $runnerIp"

      - name: Install SqlPackage
        shell: pwsh
        run: |
          dotnet tool update --global microsoft.sqlpackage --version 162.*

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install/update microsoft.sqlpackage dotnet tool."
          }

          $toolPath = Join-Path $env:USERPROFILE '.dotnet\tools'
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Publish DACPAC to target database
        shell: pwsh
        env:
          DACPAC_PATH: ${{ runner.temp }}/site/${{ env.DACPAC_NAME }}
          AZURE_SQL_SERVER_FQDN: ${{ env.AZURE_SQL_SERVER_FQDN }}
          AZURE_SQL_DB: ${{ env.AZURE_SQL_DB }}
          SQL_ADMIN_USERNAME: ${{ secrets.SQL_ADMIN_USERNAME }}
          KEYVAULT_NAME: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'sayyit-prod-kv' || 'sayyit-dev-kv' }}
        run: |
          $dacpac = $env:DACPAC_PATH
          $server = $env:AZURE_SQL_SERVER_FQDN
          $db = $env:AZURE_SQL_DB
          $user = $env:SQL_ADMIN_USERNAME

          # retrieve the SQL admin password from Key Vault (secret name: sqlServerAdministratorPassword)
          $vault = $env:KEYVAULT_NAME
          Write-Host "Retrieving sqlServerAdministratorPassword from Key Vault: $vault"

          $secretValueRaw = & az keyvault secret show --vault-name $vault --name sqlServerAdministratorPassword --query value -o tsv 2>&1
          $secretExitCode = $LASTEXITCODE

          if ($secretExitCode -ne 0) {
            $secretError = ($secretValueRaw | Out-String).Trim()
            throw "Failed to retrieve sqlServerAdministratorPassword from Key Vault '$vault' (exit code $secretExitCode). Verify Key Vault RBAC/network rules and secret name. az output: $secretError"
          }

          $pwd = ($secretValueRaw | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($pwd)) {
            throw "Key Vault '$vault' returned an empty value for secret 'sqlServerAdministratorPassword'."
          }

          Write-Host "Publishing $dacpac -> $server/$db as $user"

          # locate sqlpackage command (installed via dotnet tool)
          $sqlPackageCommand = Get-Command sqlpackage -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sqlPackageCommand) {
            $sqlPackageCommand = Get-Command SqlPackage.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if (-not $sqlPackageCommand) {
            throw "sqlpackage command not found on runner after installation."
          }

          $sqlPackage = $sqlPackageCommand.Path
          $publishReport = Join-Path $env:RUNNER_TEMP 'publish-report.xml'

          & $sqlPackage "/Action:Publish" "/SourceFile:$dacpac" "/TargetServerName:$server" "/TargetDatabaseName:$db" "/TargetUser:$user" "/TargetPassword:$pwd" "/p:BlockOnPossibleDataLoss=True" "/DeployReportPath:$publishReport"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "SqlPackage exit code: $LASTEXITCODE"
            throw "SqlPackage publish failed"
          }

          Write-Host "Publish report saved to: $publishReport"

      - name: Remove temporary SQL firewall access and restore SQL network setting
        if: always()
        shell: pwsh
        run: |
          $serverName = $env:SQL_SERVER_NAME
          $resourceGroup = '${{ env.RESOURCE_GROUP }}'
          $ruleName = $env:SQL_FIREWALL_RULE_NAME
          $originalPublicNetworkAccess = $env:SQL_PUBLIC_NETWORK_ACCESS_ORIGINAL

          if ($serverName -and $ruleName) {
            az sql server firewall-rule delete --resource-group $resourceGroup --server $serverName --name $ruleName
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to delete temporary SQL firewall rule $ruleName"
            }
          }

          if ($serverName -and $originalPublicNetworkAccess) {
            az sql server update --name $serverName --resource-group $resourceGroup --set publicNetworkAccess=$originalPublicNetworkAccess
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to restore SQL public network access to $originalPublicNetworkAccess"
            }
          }

      - name: Upload publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sayyit-db-publish-report
          path: ${{ runner.temp }}/publish-report.xml
          if-no-files-found: ignore
